services:
  postgres:
    image: postgres:16-alpine
    container_name: secureauth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureauth
      POSTGRES_PASSWORD: secureauth_secret_password
      POSTGRES_DB: secureauth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureauth -d secureauth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secureauth-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://secureauth:secureauth_secret_password@postgres:5432/secureauth_db
      JWT_SECRET: secureauth-production-jwt-secret-replace-me-32chars
      CORS_ALLOWED_ORIGINS: "*"
      RUN_MIGRATIONS: "true"
    ports:
      - "5000:5000"

volumes:
  postgres_data:
